name: Publier sur GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Le vérificateur passe AVANT le build, et la publication en dépend : un
  # contrôle rouge n'atteint plus le poste des cadres. Il tournait jusqu'ici
  # à la main seulement, et rien n'empêchait de publier sans l'avoir lancé.
  # `typescript` est installé sans être inscrit au package.json : tsc ne sert
  # qu'à vérifier, il n'a rien à faire dans les dépendances de build.
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm install --no-save typescript
      - run: ./verifier.sh

  build:
    needs: verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
