<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DatABA Manager</title>
    <meta name="description" content="Consolidation et bilan des cotations DatABA, pour les cadres pédagogiques" />

    <!-- Thème clair/sombre ET couleur d'accent posés avant le premier rendu :
         évite le flash d'un thème puis l'autre. Deux axes indépendants, deux
         attributs et deux clés. Préférence explicite sinon système pour le
         mode, neutre par défaut pour la couleur ; clés aba-cadre: en clair, ce
         ne sont pas des données sensibles — même script que côté DatABA, avec
         le préfixe de Manager.
         theme-color décrit la surface, pas l'accent : il ne suit que le mode. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('aba-cadre:theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          var a = localStorage.getItem('aba-cadre:accent');
          if (['rose', 'vert', 'jaune', 'rouge'].indexOf(a) >= 0) {
            document.documentElement.setAttribute('data-accent', a);
          }
          document.addEventListener('DOMContentLoaded', function () {
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', t === 'dark' ? '#0A1120' : '#F3F6FB');
          });
        } catch (e) {}
      })();
    </script>

    <!-- Manifeste : c'est lui, avec le service worker, qui rend l'app installable -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#F3F6FB" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-title" content="DatABA Manager" />

    <!-- Polices embarquées (src/index.css, @font-face) plutôt que chargées
         depuis fonts.googleapis.com : aucune requête réseau à l'exécution,
         donc pas de retour aux polices système hors connexion. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
