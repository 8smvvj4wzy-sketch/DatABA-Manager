<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DatABA Manager</title>
    <meta name="description" content="Consolidation et bilan des cotations DatABA, pour les cadres pédagogiques" />

    <!-- Thème clair/sombre choisi avant le premier rendu : évite le flash d'un
         thème puis l'autre. Préférence explicite sinon système ; clé
         aba-cadre: en clair, ce n'est pas une donnée sensible — même script
         que côté DatABA, avec le préfixe de Manager. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('aba-cadre:theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          document.addEventListener('DOMContentLoaded', function () {
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', t === 'dark' ? '#0A1120' : '#F3F6FB');
          });
        } catch (e) {}
      })();
    </script>

    <!-- Manifeste : c'est lui, avec le service worker, qui rend l'app installable -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#F3F6FB" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-title" content="DatABA Manager" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
